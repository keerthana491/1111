<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Happy Paws | Payment</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #f8f7f2;
    color: #333;
}

nav {
    background: white;
    padding: 18px 8%;
    box-shadow: 0 2px 10px #ddd;
}

nav h2 {
    color: #27675d;
    margin: 0;
}

.container {
    width: 90%;
    max-width: 650px;
    margin: 40px auto;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 3px 15px #ddd;
}

h1 {
    text-align: center;
    color: #27675d;
}

.amount {
    background: #e7f2ee;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.amount p {
    display: flex;
    justify-content: space-between;
    margin: 8px 0;
}

.total {
    font-size: 20px;
    font-weight: bold;
    color: #df8050;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 7px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #27675d;
    color: white;
    font-size: 16px;
}

.qrBox {
    text-align: center;
    background: #f5f5f5;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
}

.qrBox img {
    width: 180px;
    height: 180px;
}

.upiText {
    font-weight: bold;
    color: #27675d;
}

.demo {
    color: #888;
    font-size: 13px;
}

.note {
    color: #df8050;
    font-size: 14px;
}

#otpBox {
    display: none;
}

</style>

</head>


<body>


<nav>
    <h2>🐾 Happy Paws</h2>
</nav>


<div class="container">

<div class="box">

<h1>Payment</h1>


<!-- AMOUNT -->

<div class="amount">

<p>
<span>Adoption Fee</span>
<span>₹2,500</span>
</p>

<p>
<span>Care & Processing</span>
<span>₹100</span>
</p>

<hr>

<p class="total">
<span>Total Amount</span>
<span>₹2,600</span>
</p>

</div>


<form id="paymentForm"
      action="payment.php"
      method="POST">


<!-- PET NAME -->

<label>Pet Name</label>

<input
    type="text"
    id="petName"
    name="pet"
    readonly
>


<!-- PAYMENT METHOD -->

<label>Payment Method</label>

<select id="paymentMethod"
        name="method"
        required>

<option value="">
-- Select Payment Method --
</option>

<option value="upi">UPI</option>

<option value="gpay">Google Pay</option>

<option value="phonepe">PhonePe</option>

<option value="paytm">Paytm</option>

<option value="debit">Debit Card</option>

<option value="credit">Credit Card</option>

<option value="netbanking">Net Banking</option>

<option value="cash">Cash on Visit</option>

</select>


<div id="paymentFields"></div>


<!-- OTP -->

<div id="otpBox">

<label>Enter OTP</label>

<input
    type="text"
    id="otp"
    name="otp"
    maxlength="6"
    placeholder="Enter OTP"
>

<p class="note">
Demo OTP:
<b id="demoOTP"></b>
</p>

</div>


<button type="submit" id="payButton">
Pay Now
</button>


</form>

</div>

</div>


<script>


/* ================================
   GET PET NAME FROM URL
================================ */

const urlParams =
    new URLSearchParams(window.location.search);

const pet =
    urlParams.get("pet");


if (pet) {

    document.getElementById("petName").value =
        decodeURIComponent(pet);

}
else {

    document.getElementById("petName").value =
        "Not selected";

}


/* ================================
   RANDOM OTP
================================ */

let correctOTP =
    Math.floor(100000 + Math.random() * 900000).toString();

document.getElementById("demoOTP").innerText =
    correctOTP;


/* ================================
   ELEMENTS
================================ */

const paymentMethod =
    document.getElementById("paymentMethod");

const paymentFields =
    document.getElementById("paymentFields");

const otpBox =
    document.getElementById("otpBox");

const payButton =
    document.getElementById("payButton");


/* ================================
   PAYMENT METHOD
================================ */

paymentMethod.addEventListener("change", function() {

    let method = this.value;

    paymentFields.innerHTML = "";

    otpBox.style.display = "none";

    payButton.innerText = "Pay Now";


    /* UPI / GPAY / PHONEPE / PAYTM */

    if (
        method === "upi" ||
        method === "gpay" ||
        method === "phonepe" ||
        method === "paytm"
    ) {

        paymentFields.innerHTML = `

        <div class="qrBox">

            <h3>Scan & Pay</h3>

            <p>Scan this QR using any UPI app</p>

            <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi%3A%2F%2Fpay%3Fpa%3Dhappypaws%40upi%26pn%3DHappy%2520Paws%26am%3D2600%26cu%3DINR"
            alt="Payment QR Code">

            <p class="upiText">
            UPI ID: happypaws@upi
            </p>

            <p>Amount: <b>₹2,600</b></p>

            <p class="demo">
            Demo QR - No real payment is processed
            </p>

        </div>

        <label>UPI ID</label>

        <input
            type="text"
            name="details"
            id="upiId"
            placeholder="Example: name@upi"
            required
        >

        `;

        otpBox.style.display = "block";

        payButton.innerText = "Pay ₹2,600";

    }


    /* DEBIT CARD */

    else if (method === "debit") {

        paymentFields.innerHTML = `

        <label>Card Number</label>

        <input
            type="text"
            name="details"
            maxlength="16"
            placeholder="Enter 16 digit card number"
            required
        >

        <label>Expiry Date</label>

        <input
            type="text"
            placeholder="MM/YY"
            required
        >

        <label>CVV</label>

        <input
            type="password"
            maxlength="3"
            placeholder="Enter CVV"
            required
        >

        `;

        otpBox.style.display = "block";

        payButton.innerText = "Pay ₹2,600";

    }


    /* CREDIT CARD */

    else if (method === "credit") {

        paymentFields.innerHTML = `

        <label>Card Number</label>

        <input
            type="text"
            name="details"
            maxlength="16"
            placeholder="Enter 16 digit card number"
            required
        >

        <label>Expiry Date</label>

        <input
            type="text"
            placeholder="MM/YY"
            required
        >

        <label>CVV</label>

        <input
            type="password"
            maxlength="3"
            placeholder="Enter CVV"
            required
        >

        `;

        otpBox.style.display = "block";

        payButton.innerText = "Pay ₹2,600";

    }


    /* NET BANKING */

    else if (method === "netbanking") {

        paymentFields.innerHTML = `

        <label>Select Bank</label>

        <select name="details" required>

        <option value="">
        -- Select Bank --
        </option>

        <option>State Bank of India</option>
        <option>HDFC Bank</option>
        <option>ICICI Bank</option>
        <option>Axis Bank</option>
        <option>Canara Bank</option>
        <option>Indian Bank</option>

        </select>

        `;

        otpBox.style.display = "block";

        payButton.innerText = "Pay ₹2,600";

    }


    /* CASH */

    else if (method === "cash") {

        paymentFields.innerHTML = `

        <div class="qrBox">

        <h3>Cash on Visit</h3>

        <p>
        You can pay the adoption amount
        directly at Happy Paws.
        </p>

        <p>
        Amount: <b>₹2,600</b>
        </p>

        </div>

        `;

        otpBox.style.display = "none";

        payButton.innerText = "Confirm Adoption";

    }

});


/* ================================
   FORM VALIDATION
================================ */

document.getElementById("paymentForm")
.addEventListener("submit", function(event) {

    let method = paymentMethod.value;


    /* UPI VALIDATION */

    if (
        method === "upi" ||
        method === "gpay" ||
        method === "phonepe" ||
        method === "paytm"
    ) {

        let upi =
            document.getElementById("upiId").value.trim();

        let upiPattern =
            /^[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+$/;


        if (!upiPattern.test(upi)) {

            alert(
                "Invalid UPI ID!\n\n" +
                "Please enter a valid UPI ID.\n" +
                "Example: name@upi"
            );

            event.preventDefault();

            return;
        }

    }


    /* OTP VALIDATION */

    if (
        method === "upi" ||
        method === "gpay" ||
        method === "phonepe" ||
        method === "paytm" ||
        method === "debit" ||
        method === "credit" ||
        method === "netbanking"
    ) {

        let enteredOTP =
            document.getElementById("otp").value.trim();


        if (enteredOTP !== correctOTP) {

            alert("Invalid OTP!");

            event.preventDefault();

            return;
        }

        alert("OTP verified successfully!");

    }


    /* CASH */

    if (method === "cash") {

        alert(
            "Adoption confirmed!\n" +
            "Payment will be made on visit."
        );

    }

});

</script>


</body>

</html>
